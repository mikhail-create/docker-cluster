events {}

http {
    upstream backend {
        # NOTE: Least connections is used to balance the load between the servers
        least_conn;
        # NOTE: ip_hash is used to balance the load between the servers
        # ip_hash;
        # NOTE: workaround
        hash $http_x_forwarded_for consistent;
        server server1:3000;
        server server2:3000;
        server server3:3000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }
    }
}