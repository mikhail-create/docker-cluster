version: '3.8'

services:
  server1:
    build: ./server
    environment:
      - SERVER_ID=1
    volumes:
      - ./server/server.js:/app/server.js
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'  # Limits to 50% of a single CPU core
    #     reservations:
    #       cpus: '0.1'

  server2:
    build: ./server
    environment:
      - SERVER_ID=2
    volumes:
      - ./server/server.js:/app/server.js  
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'  # Limits to 50% of a single CPU core
    #     reservations:
    #       cpus: '0.1'

  server3:
    build: ./server
    environment:
      - SERVER_ID=3
    volumes:
      - ./server/server.js:/app/server.js
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '0.5'  # Limits to 50% of a single CPU core
    #     reservations:
    #       cpus: '0.1'

  nginx:
    image: nginx:1.27.4-alpine3.21
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    depends_on:
      - server1
      - server2
      - server3

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus
    ports:
      - 9090:9090
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      nginx:
        condition: service_started

  # Grafana for visualization
  grafana:
    image: grafana/grafana
    ports:
      - 3001:3000
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

volumes:
  prometheus-data:
  grafana-storage: